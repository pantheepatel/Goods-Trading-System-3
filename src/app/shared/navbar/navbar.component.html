<!-- Navbar -->
<nav class="bg-white shadow-md p-4 flex justify-between items-center">
  <!-- Left Section: Logo & Search -->
  <div class="flex items-center gap-4">
    <a routerLink="/dashboard" class="text-xl font-semibold text-blue-600">Goods Trading</a>

    <!-- Category Filter -->
    <select *ngIf="isDashboardPage" class="border rounded-lg p-2 text-gray-700" (change)="onCitySelect($event)">
      <option value="">All Cities</option>
      <option *ngFor="let city of cities" [value]="city">{{ city }}</option>
    </select>

    <select *ngIf="isDashboardPage" class="border rounded-lg p-2 text-gray-700" (change)="onPriceSortSelect($event)">
      <option value="">Sort by Price</option>
      <option value="asc">Low to High</option>
      <option value="desc">High to Low</option>
    </select>

    <!-- Search Bar -->
    <div class="flex items-center gap-2" *ngIf="isDashboardPage">
      <input 
        type="text" 
        placeholder="Search by model name & title"
        [(ngModel)]="searchQuery"
        class="border rounded-lg px-4 py-2 w-72 focus:ring focus:ring-blue-300" />
    
      <button (click)="onSearch()"
        class="px-4 py-2 rounded-lg font-medium text-white bg-blue-500 hover:bg-blue-600 transition">
        🔍 Search
      </button>
    </div>
  </div>

  <!-- Right Section: Profile Menu & Sell Button -->
  <div class="flex items-center space-x-4">
    <!-- Sell Product Button (Opens Modal) -->
    <a routerLink="/user/chat"><button (click)="OpenChat()"
      class="px-5 py-2 rounded-lg font-medium text-white bg-blue-500 hover:bg-blue-600 transition">
      Chat
    </button></a>
    


    <button (click)="openModal()"
      class="px-5 py-2 rounded-lg font-medium text-white bg-blue-500 hover:bg-blue-600 transition">
      + Sell Product
    </button>

    <a routerLink="/auth/verify-email" *ngIf="!isEmailVerified">
      <button class="px-5 py-2 rounded-lg font-medium text-white bg-blue-500 hover:bg-blue-600 transition">
        Verify
      </button>
    </a>

    <div class="relative">
      <button (click)="toggleProfileMenu()" class="flex items-center space-x-2">
        <img [src]="'https://ui-avatars.com/api/?name=' + email + '&size=45'" alt="Profile Image" class="rounded-full">
      </button>

      <!-- Dropdown Menu -->
      <div *ngIf="isProfileMenuOpen" class="absolute right-0 bg-white shadow-lg rounded-lg w-48 mt-2">
        <ul class="py-2">
          <li><a routerLink="/profile" class="block px-4 py-2 hover:bg-gray-100">Profile</a></li>
          <li><a routerLink="/favourites" class="block px-4 py-2 hover:bg-gray-100">Favourites</a></li>
          <li><a routerLink="/my-ads" class="block px-4 py-2 hover:bg-gray-100">My Ads</a></li>
          <li class="border-t">
            <button (click)="logout()" class="w-full text-left px-4 py-2 text-red-500 hover:bg-gray-100">
              Logout
            </button>
          </li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<!-- 🟢 Improved Subnavbar (Categories) -->
<div *ngIf="isDashboardPage" class="bg-gray-100 shadow-inner">
  <div class="container mx-auto py-3 overflow-x-auto whitespace-nowrap">
    <div class="flex items-center justify-center space-x-4 md:space-x-6">
      <span *ngFor="let category of categories"
        (click)="onCategorySelect(category)"
        [class.bg-blue-500]="selectedCategory === category"
        [class.text-white]="selectedCategory === category"
        class="cursor-pointer px-4 py-2 text-gray-700 bg-white rounded-lg shadow hover:bg-blue-500 hover:text-white transition">
        {{ category }}
      </span>
    </div>
  </div>
</div>
<!-- 🟢 Sell Product Modal (Appears on Click) -->
<app-sell-modal *ngIf="isModalOpen" (closeModal)="closeModal()"></app-sell-modal>
