<div class="p-4">
    <h2 class="text-xl font-bold mb-4">Your Favourite Products</h2>
  
    <div *ngIf="favourites.length > 0; else noFavourites">
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        
        <div *ngFor="let product of favourites" class="bg-white shadow-lg rounded-xl overflow-hidden">
          
          <!-- Product Image -->
          <img [src]="product.image ? product.image : 'assets/no-image.png'"
               alt="Product Image"
               class="w-full h-48 object-cover">
  
          <div class="p-4">
            <h2 class="text-lg font-semibold text-gray-800">{{ product.title }}</h2>
            
            <p class="text-sm text-gray-500">
              {{ product.city }} • <span class="text-blue-500">{{ getRelativeTime(product.postedDate) }}</span>
            </p>            
            
            <p class="text-lg font-bold text-blue-600 mt-2">₹{{ product.price }}</p>
            
            <div class="flex justify-between mt-4">
              <span class="text-sm px-3 py-1 bg-gray-200 rounded-lg">{{ product.category }}</span>
              
              <!-- Unfavourite Button -->
              <button (click)="unfavouriteProduct(product)"
                      class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-red-600">
                Unfavourite
              </button>
            </div>
          </div>
  
        </div>
      </div>
    </div>
  
    <!-- No Favourites Message -->
    <ng-template #noFavourites>
      <p class="text-gray-500">You have no favourite products.</p>
    </ng-template>
  </div>
