<div class="p-6 bg-white rounded-lg shadow-md max-w-3xl mx-auto">
    <h2 class="text-xl font-bold mb-4 text-blue-700">Notifications</h2>

    <ng-container *ngFor="let n of notifications">
        <!-- Skip Rejected notifications -->
        <div *ngIf="n.status !== 'Rejected'" class="border-b border-gray-200 py-4">
            <p class="font-medium text-gray-800">🛒 Product: {{ n.productTitle }}</p>
            <p class="text-sm text-gray-500">Status:
                <span [ngClass]="{
            'text-yellow-600': n.status === 'Pending',
            'text-green-600': n.status === 'Approved',
            'text-blue-600': n.status === 'Completed'
          }">{{ n.status }}</span>
            </p>

            <!-- Buyer Section -->
            <div *ngIf="n.buyerEmail === email && n.status === 'Pending'" class="mt-2">
                <p class="text-green-700 font-semibold">Awaiting your response:</p>
                <button (click)="sendBuyerResponse(n, 'Approved')"
                    class="mr-2 px-4 py-1 bg-green-600 text-white rounded hover:bg-green-700">
                    Approve
                </button>
                <button (click)="sendBuyerResponse(n, 'Rejected')"
                    class="px-4 py-1 bg-red-600 text-white rounded hover:bg-red-700">
                    Reject
                </button>
            </div>

            <!-- Seller Section -->
            <div *ngIf="n.sellerEmail === email && n.status === 'Approved'" class="mt-2">
                <p class="text-blue-700 font-semibold">Buyer approved. Confirm to complete sale:</p>
                <button (click)="confirmPurchase(n)" class="px-4 py-1 bg-blue-600 text-white rounded hover:bg-blue-700">
                    Confirm Purchase
                </button>
            </div>

            <!-- Completed -->
            <div *ngIf="n.status === 'Completed'" class="mt-2">
                <p class="italic text-gray-600">Transaction completed ✅</p>
            </div>
        </div>
    </ng-container>
</div>
