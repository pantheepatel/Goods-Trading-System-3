<div class="grid grid-cols-3 gap-4 h-screen p-4">

    <!-- User List Column -->
    <div class="col-span-1 bg-gray-50 p-4 rounded-lg shadow-md">
        <h3 class="text-lg font-semibold mb-4">Available Users</h3>
        <button *ngFor="let user of availableUsers" 
                (click)="startChat(user.userId)" 
                class="w-full bg-blue-500 text-white py-2 rounded-lg font-medium mt-4 hover:bg-blue-600 transition">
            {{ user.fullName }}
        </button>
    </div>

    <!-- Chat Column -->
    <div id="root" class="col-span-2 bg-white p-4 rounded-lg shadow-md">

        <!-- Chat Info -->
        <div *ngIf="otherUser" class="chat-info mb-4">
            <h4 class="text-xl font-semibold">Chatting with: {{ otherUser.fullName }}</h4>
            <p class="mt-2">Status: 
                <span [ngClass]="onlineStatus === 'Online' ? 'text-green-500' : 'text-red-500'">
                    {{ onlineStatus }}
                </span>
            </p>
        </div>

        <!-- Stream Chat Components -->
        <stream-channel>
            <stream-channel-header></stream-channel-header>
            <stream-message-list></stream-message-list>
            <stream-message-input></stream-message-input>
        </stream-channel>
    </div>

</div>
