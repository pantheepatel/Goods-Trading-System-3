<div class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center">
    <div class="bg-white p-6 rounded-xl shadow-lg w-80">
      <h2 class="text-lg font-semibold text-gray-800 mb-4">Choose a Category</h2>
      
      <div class="grid grid-cols-2 gap-3">
        <div *ngFor="let category of categories" 
          (click)="navigateToCategory(category)" 
          class="p-3 bg-gray-200 rounded-lg text-center cursor-pointer hover:bg-blue-500 hover:text-white transition">
          {{ category }}
        </div>
      </div>
  
      <button class="mt-4 w-full py-2 bg-red-500 text-white rounded-lg hover:bg-red-600"
        (click)="closeModal.emit()">
        Cancel
      </button>
    </div>
  </div>
