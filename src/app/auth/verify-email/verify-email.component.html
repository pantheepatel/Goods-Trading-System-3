<div class="flex justify-center items-center min-h-screen bg-gray-100">
    <div class="bg-white p-6 rounded-2xl shadow-lg w-80 text-center">
      <h2 class="text-xl font-semibold text-gray-700 mb-4">Verify Email</h2>
      
      <p class="text-gray-600 mb-4">Enter the 6-digit OTP sent to your email</p>

      <input 
        type="text"
        [(ngModel)]="otp"
        (input)="handleInput($event)"
        maxlength="6"
        class="w-full text-center px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400"
        placeholder="Enter OTP"
      />

      <button 
        class="w-full bg-blue-500 text-white py-2 rounded-lg font-medium mt-4 hover:bg-blue-600 transition"
        (click)="verifyOTP()"
        [disabled]="otp.length !== 6"
      >
        Verify OTP
      </button>

      <button 
        class="w-full text-blue-500 mt-4 hover:underline"
        (click)="resendOTP()"
        [disabled]="resendDisabled"
      >
        Resend OTP {{ resendDisabled ? '(' + formattedCountdown + ')' : '' }}
      </button>
    </div>
</div>
